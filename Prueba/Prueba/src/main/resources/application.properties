spring.application.name=Prueba

# Conexión a la base de datos MySQL en XAMPP
spring.datasource.url=jdbc:mysql://localhost:3306/restaurante_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración JPA (Crea y actualiza tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true