<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Restaurante</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card-login { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; position: relative; }
        h2 { text-align: center; color: #333; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-submit { background-color: #27ae60; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; }
        .btn-submit:hover { background-color: #219150; }
        .btn-secondary { background-color: #7f8c8d; color: white; border: none; padding: 10px; border-radius: 4px; cursor: pointer; font-size: 14px; width: 100%; margin-top: 5px; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; text-align: center; display: none; }
        .link-registro { text-align: center; margin-top: 15px; font-size: 14px; }
        .link-registro a { color: #2980b9; text-decoration: none; cursor: pointer; }
        
        /* ESTILOS PARA LA MODAL DE RECUPERAR CONTRASEÑA */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 380px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal-header { font-size: 18px; font-weight: bold; margin-bottom: 15px; color: #2c3e50; text-align: center; }
        .step-instruction { font-size: 13px; color: #666; margin-bottom: 15px; text-align: center; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card-login">
    <h2>Iniciar Sesión</h2>
    <form id="formLogin">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" required placeholder="tu@correo.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        
        <div style="text-align: right; margin-bottom: 10px;">
            <a onclick="abrirModalRecuperar()" style="color: #e67e22; font-size: 13px; text-decoration: none; cursor: pointer; font-weight: bold;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn-submit">Ingresar</button>
        <div class="error-msg" id="errorMsg">Correo o contraseña incorrectos</div>
    </form>
    
    <div class="link-registro">
        ¿No tienes cuenta? <a href="registro.html">Regístrate aquí</a>
    </div>
</div>

<!-- MODAL PARA RECUPERAR CONTRASEÑA (2 PASOS SEGUROS) -->
<div class="modal-overlay" id="modalRecuperar">
    <div class="modal-content">
        <div class="modal-header">🔑 Recuperar Contraseña</div>

        <!-- PASO 1: Ingresar correo para solicitar token -->
        <form id="formSolicitarToken">
            <div class="step-instruction">
                Ingresa tu correo registrado para generar una clave temporal de recuperación.
            </div>
            <div class="form-group">
                <label>Correo Electrónico</label>
                <input type="email" id="recuperarEmail" required placeholder="tu@correo.com">
            </div>
            <button type="submit" class="btn-submit" style="background-color: #3498db;">Solicitar Clave</button>
            <button type="button" class="btn-secondary" onclick="cerrarModalRecuperar()">Cancelar</button>
        </form>

        <!-- PASO 2: Validar Token y cambiar clave -->
        <form id="formConfirmarToken" style="display: none;">
            <div class="step-instruction" style="color: #27ae60;">
                ¡Código generado! Ingresa la clave recibida y tu nueva contraseña.
            </div>
            <div class="form-group">
                <label>Clave de Autorización (Token)</label>
                <input type="text" id="tokenInput" required placeholder="Pega el token aquí">
            </div>
            <div class="form-group">
                <label>Nueva Contraseña</label>
                <input type="password" id="nuevaPasswordInput" minlength="4" required placeholder="Nueva contraseña">
            </div>
            <button type="submit" class="btn-submit" style="background-color: #27ae60;">Cambiar Contraseña</button>
            <button type="button" class="btn-secondary" onclick="cerrarModalRecuperar()">Cancelar</button>
        </form>
    </div>
</div>

<script>
    const API_BASE = "http://localhost:8080/api/usuarios";

    // 1. AUTENTICACIÓN / LOGIN
    document.getElementById("formLogin").addEventListener("submit", async (e) => {
        e.preventDefault();

        const datosLogin = {
            email: document.getElementById("email").value,
            password: document.getElementById("password").value
        };

        try {
            const res = await fetch(`${API_BASE}/login`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(datosLogin)
            });

            if (res.ok) {
                const usuario = await res.json();

                // Guardamos el rol, email y nombre en el localStorage
                localStorage.setItem("rol", usuario.rol);
                localStorage.setItem("email", usuario.email || datosLogin.email);
                localStorage.setItem("nombre", usuario.nombre || "");

                // Redirección según ROL
                if (usuario.rol === "ADMIN") {
                    window.location.href = "index.html";
                } else {
                    window.location.href = "cliente.html";
                }

            } else {
                const errorData = await res.json().catch(() => null);
                const mensaje = errorData ? errorData.error : "Credenciales incorrectas";
                alert("Error: " + mensaje);
            }
        } catch (error) {
            console.error("Error de conexión:", error);
            alert("No se pudo conectar con el servidor.");
        }
    });

    // 2. CONTROL DEL MODAL DE RECUPERACIÓN
    function abrirModalRecuperar() {
        document.getElementById("modalRecuperar").style.display = "flex";
        document.getElementById("formSolicitarToken").style.display = "block";
        document.getElementById("formConfirmarToken").style.display = "none";
    }

    function cerrarModalRecuperar() {
        document.getElementById("modalRecuperar").style.display = "none";
        document.getElementById("formSolicitarToken").reset();
        document.getElementById("formConfirmarToken").reset();
    }

    // 3. PASO 1: SOLICITAR TOKEN (/solicitar-recuperacion)
    document.getElementById("formSolicitarToken").addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("recuperarEmail").value.trim();

        try {
            const res = await fetch(`${API_BASE}/solicitar-recuperacion`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ email })
            });

            const data = await res.json();

            if (res.ok) {
                alert("✅ Clave de recuperación generada.\n\nTu Token es:\n" + data.token);
                
                // Transición al Paso 2
                document.getElementById("formSolicitarToken").style.display = "none";
                document.getElementById("formConfirmarToken").style.display = "block";
                document.getElementById("tokenInput").value = data.token; // Relleno automático para pruebas rápidas
            } else {
                alert("❌ Error: " + (data.error || "No se pudo generar la solicitud"));
            }
        } catch (error) {
            console.error("Error en la solicitud:", error);
            alert("⚠️ No se pudo conectar con el servidor.");
        }
    });

    // 4. PASO 2: CONFIRMAR RECUPERACIÓN (/confirmar-recuperacion)
    document.getElementById("formConfirmarToken").addEventListener("submit", async (e) => {
        e.preventDefault();

        const token = document.getElementById("tokenInput").value.trim();
        const nuevaPassword = document.getElementById("nuevaPasswordInput").value;

        try {
            const res = await fetch(`${API_BASE}/confirmar-recuperacion`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ token, nuevaPassword })
            });

            const data = await res.json();

            if (res.ok) {
                alert("🎉 " + (data.mensaje || "Contraseña restablecida exitosamente"));
                cerrarModalRecuperar();
            } else {
                alert("❌ Error: " + (data.error || "Token inválido o expirado"));
            }
        } catch (error) {
            console.error("Error en confirmación:", error);
            alert("⚠️ No se pudo conectar con el servidor.");
        }
    });
</script>

</body>
</html>
