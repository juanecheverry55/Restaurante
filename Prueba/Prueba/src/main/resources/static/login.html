<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Restaurante</title>
    <!-- CSS de Bootstrap y Estilos Corporativos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1f3d2b 0%, #2b1a1a 100%);
            color: #ffffff;
        }
        .card-custom {
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 164, 75, 0.4);
            border-radius: 12px;
            color: white;
            width: 100%;
            max-width: 420px;
        }
        .btn-gold {
            background-color: #d4a44b;
            color: #1a1a1a;
            border: none;
            font-weight: bold;
        }
        .btn-gold:hover {
            background-color: #b8892f;
            color: #ffffff;
        }
        .text-gold {
            color: #d4a44b !important;
        }
        a {
            color: #d4a44b;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="card card-custom shadow-lg p-4">
        <div class="text-center mb-4">
            <h2 class="text-gold fw-bold">🍽️ Restaurante</h2>
            <p class="text-light small">Ingresa tus credenciales para acceder</p>
        </div>

        <form id="form-login">
            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" id="email" class="form-control bg-dark text-light border-secondary" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label fw-bold">Contraseña</label>
                <input type="password" id="password" class="form-control bg-dark text-light border-secondary" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn btn-gold w-100 py-2 mt-2">Iniciar Sesión</button>
        </form>

        <div class="text-center mt-4">
            <p class="small mb-1">
                <a href="recuperar.html">¿Olvidaste tu contraseña?</a>
            </p>
            <p class="small mb-0">
                ¿No tienes cuenta? <a href="registro.html" class="fw-bold">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_USUARIOS = "http://localhost:8080/api/usuarios";

        document.addEventListener("DOMContentLoaded", () => {
            // Limpia credenciales previas para evitar re-redirecciones no deseadas
            localStorage.clear();
            sessionStorage.clear();
        });

        document.getElementById("form-login").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            try {
                const res = await fetch(`${API_USUARIOS}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email, password })
                });

                if (res.ok) {
                    const usuario = await res.json();

                    // Guardar los datos de sesión en localStorage
                    localStorage.setItem("rol", usuario.rol);
                    localStorage.setItem("email", usuario.email);
                    localStorage.setItem("nombre", usuario.nombre || "");

                    // Redirección según el rol retornado por la API
                    if (usuario.rol === "ADMIN") {
                        window.location.href = "index.html";
                    } else if (usuario.rol === "CLIENTE") {
                        window.location.href = "cliente.html";
                    } else {
                        alert("Rol de usuario desconocido.");
                    }
                } else {
                    const msj = await res.text();
                    alert(msj || "Credenciales incorrectas. Revisa tu correo o contraseña.");
                }
            } catch (error) {
                console.error("Error al iniciar sesión:", error);
                alert("No se pudo conectar con el servidor. Verifica que Spring Boot esté en ejecución.");
            }
        });
    </script>
</body>
</html>
