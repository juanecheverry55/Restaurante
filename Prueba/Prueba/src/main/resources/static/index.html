<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Restaurante</title>
    <!-- CSS de Bootstrap y Estilos Corporativos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
    <style>
        body {
            background: linear-gradient(135deg, #1f3d2b 0%, #2b1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* LAYOUT CON SIDEBAR */
        .wrapper {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        /* MENÚ LATERAL (SIDEBAR) */
        #sidebar {
            min-width: 260px;
            max-width: 260px;
            background: rgba(20, 35, 25, 0.95);
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(212, 164, 75, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
        }

        /* ESTADO COLAPSADO DEL SIDEBAR */
        #sidebar.collapsed {
            margin-left: -260px;
        }

        #sidebar .sidebar-header {
            padding: 20px;
            background: rgba(43, 26, 26, 0.85);
            border-bottom: 1px solid rgba(212, 164, 75, 0.3);
        }

        #sidebar .components {
            padding: 20px 10px;
        }

        .sidebar-btn {
            width: 100%;
            text-align: left;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.2);
            color: #e0e0e0;
            border: 1px solid transparent;
            font-weight: 500;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .sidebar-btn:hover {
            background: rgba(212, 164, 75, 0.15);
            color: #d4a44b;
            border-color: rgba(212, 164, 75, 0.4);
        }

        .sidebar-btn.active {
            background: #d4a44b !important;
            color: #1a1a1a !important;
            font-weight: bold;
            border-color: #d4a44b;
        }

        /* BOTÓN PARA COLAPSAR SIDEBAR */
        .btn-toggle-sidebar {
            background: rgba(212, 164, 75, 0.2);
            border: 1px solid rgba(212, 164, 75, 0.4);
            color: #d4a44b;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-toggle-sidebar:hover {
            background: #d4a44b;
            color: #1a1a1a;
        }

        /* CONTENIDO PRINCIPAL */
        #content {
            width: 100%;
            padding: 25px;
            min-height: 100vh;
            transition: all 0.3s ease;
        }

        /* ESTILOS TARJETAS Y TABLAS */
        .card-custom {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(212, 164, 75, 0.3);
            color: white;
        }
        .card-custom .card-header {
            background: rgba(43, 26, 26, 0.85);
            border-bottom: 1px solid rgba(212, 164, 75, 0.3);
        }
        .table-custom-container {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-gold {
            background-color: #d4a44b;
            color: #1a1a1a;
            border: none;
            font-weight: bold;
        }
        .btn-gold:hover {
            background-color: #b8892f;
            color: #ffffff;
        }
        .text-gold {
            color: #d4a44b !important;
        }

        /* ADAPTACIÓN PARA PANTALLAS PEQUEÑAS */
        @media (max-width: 768px) {
            #sidebar {
                position: fixed;
                z-index: 999;
                height: 100vh;
            }
            #sidebar.collapsed {
                margin-left: -260px;
            }
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- MENÚ LATERAL IZQUIERDO (SIDEBAR) -->
        <nav id="sidebar">
            <div>
                <div class="sidebar-header d-flex justify-content-between align-items-center">
                    <div>
                        <h4 class="text-gold fw-bold mb-0">🍽️ Restaurante</h4>
                        <small class="text-light opacity-75">Panel de Control</small>
                    </div>
                </div>

                <div class="components">
                    <button class="sidebar-btn active" id="btn-sec-menu" onclick="mostrarSeccion('seccion-menu')">
                        <span>🍽️ Gestión del Menú</span>
                    </button>
                    
                    <button class="sidebar-btn" id="btn-sec-pedidos" onclick="mostrarSeccion('seccion-pedidos')">
                        <span>📦 Pedidos y Mesas</span>
                    </button>

                    <button class="sidebar-btn opacity-75" onclick="alert('El módulo de Inventario estará disponible próximamente.')">
                        <span>📦 Inventario</span>
                        <span class="badge bg-secondary">Próximo</span>
                    </button>

                    <button class="sidebar-btn opacity-75" onclick="alert('El módulo de Resumen de Ventas estará disponible próximamente.')">
                        <span>📊 Ventas</span>
                        <span class="badge bg-secondary">Próximo</span>
                    </button>
                </div>
            </div>

            <!-- BOTÓN CERRAR SESIÓN EN LA PARTE INFERIOR -->
            <div class="p-3 border-top border-secondary">
                <a href="login.html" class="btn btn-outline-danger w-100 fw-bold" role="button" onclick="cerrarSesion()">
                    🚪 Cerrar Sesión
                </a>
            </div>
        </nav>

        <!-- ÁREA DE CONTENIDO PRINCIPAL (DERECHA) -->
        <div id="content">
            
            <!-- BARRA SUPERIOR DE ACCIONES -->
            <div class="d-flex align-items-center mb-4 gap-3">
                <button class="btn-toggle-sidebar fw-bold" onclick="toggleSidebar()" title="Ocultar / Mostrar Menú">
                    ☰ Menú
                </button>
                <h2 class="text-gold fw-bold mb-0" id="titulo-seccion-actual">🍽️ Gestión del Menú</h2>
            </div>
            
            <!-- SECCIÓN 1: GESTIÓN DE PLATOS (MENÚ) -->
            <div id="seccion-menu">
                <!-- FORMULARIO DE AGREGAR / EDITAR PLATO -->
                <div class="card card-custom shadow-sm mb-5">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0 text-gold" id="titulo-form">➕ Agregar Nuevo Plato al Menú</h5>
                        <button type="button" class="btn btn-sm btn-outline-light" id="btn-cancelar-edicion" onclick="limpiarFormulario()" style="display: none;">Cancelar Edición</button>
                    </div>
                    <div class="card-body">
                        <form id="form-plato">
                            <input type="hidden" id="plato-id">

                            <div class="row g-3">
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Nombre del Plato</label>
                                    <input type="text" id="nombre" class="form-control" placeholder="Ej: Bandeja Paisa" required>
                                </div>
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Precio ($)</label>
                                    <input type="number" step="0.01" id="precio" class="form-control" placeholder="Ej: 25000" required>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold">URL o Nombre de la Imagen</label>
                                    <input type="text" id="imagen" class="form-control" placeholder="https://ejemplo.com/imagen.jpg o foto.jpg" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label fw-bold">Descripción del Plato</label>
                                    <textarea id="descripcion" class="form-control" rows="2" placeholder="Ej: Delicioso plato típico..." required></textarea>
                                </div>
                            </div>
                            <button type="submit" id="btn-guardar" class="btn btn-gold mt-3 w-100 fw-bold">
                                Guardar Plato en el Menú
                            </button>
                        </form>
                    </div>
                </div>

                <!-- CATÁLOGO DE PLATOS -->
                <h4 class="mb-4 text-gold">📋 Platos Disponibles en la Carta</h4>
                <div id="contenedor-platos" class="row">
                    <!-- Carga dinámica -->
                </div>
            </div>

            <!-- SECCIÓN 2: GESTIÓN DE PEDIDOS -->
            <div id="seccion-pedidos" class="d-none">
                <div class="table-responsive table-custom-container p-3 rounded mb-5 shadow">
                    <table class="table table-dark table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Cliente</th>
                                <th>Detalle del Pedido</th>
                                <th>Total</th>
                                <th>Estado</th>
                                <th class="text-center">Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-pedidos">
                            <!-- Carga dinámica -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_PLATOS = "http://localhost:8080/api/platos";
        const API_PEDIDOS = "http://localhost:8080/api/pedidos";

        document.addEventListener("DOMContentLoaded", () => {
            // Protección de acceso: valida sesión y rol de ADMIN
            const rol = localStorage.getItem("rol");
            if (!rol || rol !== "ADMIN") {
                window.location.replace("login.html");
                return;
            }

            cargarPlatos();
            cargarPedidos();
        });

        // FUNCIÓN PARA ABRIR Y CERRAR (COLAPSAR) EL SIDEBAR
        function toggleSidebar() {
            document.getElementById("sidebar").classList.toggle("collapsed");
        }

        // CONTROL DE NAVEGACIÓN ENTRE SECCIONES DESDE EL SIDEBAR
        function mostrarSeccion(idSeccion) {
            document.getElementById("seccion-menu").classList.add("d-none");
            document.getElementById("seccion-pedidos").classList.add("d-none");

            document.getElementById("btn-sec-menu").classList.remove("active");
            document.getElementById("btn-sec-pedidos").classList.remove("active");

            document.getElementById(idSeccion).classList.remove("d-none");

            const tituloHeader = document.getElementById("titulo-seccion-actual");

            if (idSeccion === 'seccion-menu') {
                document.getElementById("btn-sec-menu").classList.add("active");
                tituloHeader.innerText = "🍽️ Gestión del Menú";
            } else if (idSeccion === 'seccion-pedidos') {
                document.getElementById("btn-sec-pedidos").classList.add("active");
                tituloHeader.innerText = "📦 Gestión de Pedidos";
            }
        }

        function cerrarSesion() {
            localStorage.clear();
            sessionStorage.clear();
            window.location.replace("login.html");
        }

        function formatearUrlImagen(imagenStr) {
            if (!imagenStr || imagenStr.trim() === "") {
                return "https://via.placeholder.com/300x200?text=Sin+Imagen";
            }

            let url = imagenStr.trim();

            if (url.startsWith("uploads/")) {
                url = url.replace("uploads/", "");
            }

            if (url.includes("imgur.com") && !url.includes("i.imgur.com")) {
                const idImgur = url.split('/').pop().replace('a_', '');
                return `https://i.imgur.com/${idImgur}.jpg`;
            }

            if (url.startsWith("http://") || url.startsWith("https://")) {
                return url;
            }

            return `http://localhost:8080/uploads/${url}`;
        }

        async function cargarPlatos() {
            try {
                const res = await fetch(API_PLATOS);
                if (!res.ok) throw new Error("Error al obtener platos");
                const platos = await res.json();

                const contenedor = document.getElementById("contenedor-platos");
                contenedor.innerHTML = "";

                if (platos.length === 0) {
                    contenedor.innerHTML = `<div class="col-12"><p class="text-light">No hay platos registrados en el menú.</p></div>`;
                    return;
                }

                platos.forEach(plato => {
                    const imagenRecibida = plato.imagen || plato.imagenUrl || "";
                    const urlImg = formatearUrlImagen(imagenRecibida);
                    const platoJSON = JSON.stringify(plato).replace(/'/g, "&apos;").replace(/"/g, "&quot;");

                    contenedor.innerHTML += `
                        <div class="col-md-4 mb-4">
                            <div class="card card-custom h-100 shadow-sm">
                                <img src="${urlImg}" 
                                     class="card-img-top" 
                                     alt="${plato.nombre}" 
                                     style="height: 200px; object-fit: cover;" 
                                     onerror="this.onerror=null; this.src='https://via.placeholder.com/300x200?text=Sin+Imagen';">
                                <div class="card-body d-flex flex-column justify-content-between">
                                    <div>
                                        <h5 class="card-title text-gold">${plato.nombre}</h5>
                                        <p class="card-text text-light small">${plato.descripcion || 'Sin descripción disponible.'}</p>
                                    </div>
                                    <div>
                                        <p class="card-text text-gold fw-bold fs-5 mt-2">$${plato.precio}</p>
                                        <div class="d-flex gap-2 mt-2">
                                            <button class="btn btn-warning btn-sm w-50 fw-bold text-dark" onclick='prepararEdicion(${platoJSON})'>
                                                ✏️ Editar
                                            </button>
                                            <button class="btn btn-danger btn-sm w-50 fw-bold" onclick="eliminarPlato(${plato.id}, '${plato.nombre}')">
                                                🗑️ Eliminar
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar platos:", error);
            }
        }

        function prepararEdicion(plato) {
            document.getElementById("plato-id").value = plato.id;
            document.getElementById("nombre").value = plato.nombre;
            document.getElementById("precio").value = plato.precio;
            document.getElementById("imagen").value = plato.imagen || plato.imagenUrl || "";
            document.getElementById("descripcion").value = plato.descripcion || "";

            document.getElementById("titulo-form").innerText = "✏️ Editar Plato #" + plato.id;
            document.getElementById("btn-guardar").innerText = "Actualizar Plato";
            document.getElementById("btn-guardar").className = "btn btn-warning mt-3 w-100 fw-bold text-dark";
            document.getElementById("btn-cancelar-edicion").style.display = "inline-block";

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function limpiarFormulario() {
            document.getElementById("form-plato").reset();
            document.getElementById("plato-id").value = "";
            document.getElementById("titulo-form").innerText = "➕ Agregar Nuevo Plato al Menú";
            document.getElementById("btn-guardar").innerText = "Guardar Plato en el Menú";
            document.getElementById("btn-guardar").className = "btn btn-gold mt-3 w-100 fw-bold";
            document.getElementById("btn-cancelar-edicion").style.display = "none";
        }

        // GUARDAR O ACTUALIZAR PLATO
        document.getElementById("form-plato").addEventListener("submit", async (e) => {
            e.preventDefault();

            const id = document.getElementById("plato-id").value;
            const plato = {
                nombre: document.getElementById("nombre").value,
                precio: parseFloat(document.getElementById("precio").value),
                imagen: document.getElementById("imagen").value,
                descripcion: document.getElementById("descripcion").value
            };

            const esEdicion = Boolean(id);
            const url = esEdicion ? `${API_PLATOS}/${id}` : API_PLATOS;
            const metodo = esEdicion ? "PUT" : "POST";

            try {
                const res = await fetch(url, {
                    method: metodo,
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(plato)
                });

                if (res.ok) {
                    alert(esEdicion ? "¡Plato actualizado con éxito!" : "¡Plato guardado con éxito!");
                    limpiarFormulario();
                    cargarPlatos();
                } else {
                    alert("Error al procesar la solicitud en el servidor.");
                }
            } catch (error) {
                console.error("Error de conexión:", error);
                alert("No se pudo conectar con el servidor.");
            }
        });

        // ELIMINAR PLATO CON CONFIRMACIÓN
        async function eliminarPlato(id, nombre) {
            if (confirm(`¿Estás seguro de que deseas eliminar el plato "${nombre}"?`)) {
                try {
                    const res = await fetch(`${API_PLATOS}/${id}`, {
                        method: "DELETE"
                    });

                    if (res.ok) {
                        alert("Plato eliminado correctamente.");
                        cargarPlatos();
                    } else {
                        alert("No se pudo eliminar el plato.");
                    }
                } catch (error) {
                    console.error("Error al eliminar el plato:", error);
                    alert("Error de conexión al intentar eliminar.");
                }
            }
        }

        async function cargarPedidos() {
            try {
                const res = await fetch(API_PEDIDOS);
                if (!res.ok) throw new Error("Error al obtener pedidos");
                const pedidos = await res.json();

                const tabla = document.getElementById("tabla-pedidos");
                tabla.innerHTML = "";

                if (pedidos.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="6" class="text-center text-light">No hay pedidos registrados aún.</td></tr>`;
                    return;
                }

                pedidos.forEach(p => {
                    const estado = (p.estado || "PENDIENTE").toUpperCase();
                    
                    let badgeClass = "bg-warning text-dark";
                    let accionesHTML = "";

                    if (estado === "PENDIENTE") {
                        badgeClass = "bg-warning text-dark";
                        accionesHTML = `
                            <button class="btn btn-sm btn-primary me-1" onclick="cambiarEstadoPedido(${p.id}, 'EN_PREPARACION')">
                                👨‍🍳 Enviar a Cocina
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="cambiarEstadoPedido(${p.id}, 'CANCELADO')">
                                ❌ Cancelar
                            </button>
                        `;
                    } else if (estado === "EN_PREPARACION") {
                        badgeClass = "bg-info text-dark";
                        accionesHTML = `
                            <button class="btn btn-sm btn-success me-1" onclick="cambiarEstadoPedido(${p.id}, 'ENTREGADO')">
                                ✅ Marcar Entregado
                            </button>
                            <button class="btn btn-sm btn-outline-danger" onclick="cambiarEstadoPedido(${p.id}, 'CANCELADO')">
                                ❌
                            </button>
                        `;
                    } else if (estado === "ENTREGADO") {
                        badgeClass = "bg-success";
                        accionesHTML = `<span class="text-success small fw-bold">✔ Completado</span>`;
                    } else if (estado === "CANCELADO") {
                        badgeClass = "bg-danger";
                        accionesHTML = `<span class="text-danger small fw-bold">✖ Cancelado</span>`;
                    }

                    tabla.innerHTML += `
                        <tr>
                            <td><strong>#${p.id}</strong></td>
                            <td>${p.clienteEmail}</td>
                            <td>${p.detallePlatos}</td>
                            <td class="text-gold fw-bold">$${p.total}</td>
                            <td><span class="badge ${badgeClass}">${estado.replace('_', ' ')}</span></td>
                            <td class="text-center">${accionesHTML}</td>
                        </tr>
                    `;
                });
            } catch (error) {
                console.error("Error al cargar pedidos:", error);
            }
        }

        async function cambiarEstadoPedido(id, nuevoEstado) {
            try {
                const res = await fetch(`${API_PEDIDOS}/${id}`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ estado: nuevoEstado })
                });

                if (res.ok) {
                    cargarPedidos();
                } else {
                    alert("No se pudo actualizar el estado del pedido.");
                }
            } catch (error) {
                console.error("Error al cambiar estado:", error);
                alert("Error de conexión al intentar actualizar el pedido.");
            }
        }
    </script>
</body>
</html>
