<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - Restaurante</title>
    <!-- CSS de Bootstrap y Estilos Corporativos -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/estilos.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-custom {
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(212, 164, 75, 0.3);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
            color: white;
            padding: 30px;
        }

        .btn-gold {
            background-color: #d4a44b;
            color: #ffffff;
            border: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }

        .btn-gold:hover {
            background-color: #b8892f;
            color: #ffffff;
        }

        .text-gold {
            color: #d4a44b !important;
        }

        .link-gold {
            color: #d4a44b;
            text-decoration: none;
            font-weight: bold;
        }

        .link-gold:hover {
            color: #b8892f;
            text-decoration: underline;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(212, 164, 75, 0.4);
            color: #222;
        }

        .form-control:focus {
            background: #ffffff;
            border-color: #d4a44b;
            box-shadow: 0 0 5px rgba(212, 164, 75, 0.5);
        }
    </style>
</head>
<body>
    <div class="container col-11 col-sm-8 col-md-5 col-lg-4">
        <div class="card card-custom shadow-lg">
            <h4 class="text-center mb-4 text-gold fw-bold">🔑 Recuperar Contraseña</h4>
            
            <!-- Paso 1: Enviar correo -->
            <div id="paso1">
                <div class="mb-3">
                    <label class="form-label fw-bold text-light">Correo electrónico</label>
                    <input type="email" id="email" class="form-control" placeholder="ejemplo@correo.com" required>
                </div>
                <button onclick="solicitarCodigo()" class="btn btn-gold w-100 py-2">Enviar Código al Correo</button>
            </div>

            <!-- Paso 2: Introducir código y nueva clave -->
            <div id="paso2" style="display: none;">
                <div class="mb-3">
                    <label class="form-label fw-bold text-light">Código recibido en tu correo</label>
                    <input type="text" id="codigo" class="form-control" placeholder="123456" maxlength="6" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold text-light">Nueva Contraseña</label>
                    <input type="password" id="nuevaPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button onclick="restablecer()" class="btn btn-success w-100 py-2 fw-bold">Cambiar Contraseña</button>
            </div>

            <div id="mensaje" class="mt-3 text-center text-gold small"></div>
            
            <div class="text-center mt-4">
                <a href="login.html" class="link-gold small">← Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function solicitarCodigo() {
            const email = document.getElementById('email').value;
            if (!email) {
                document.getElementById('mensaje').innerText = 'Por favor ingresa tu correo.';
                return;
            }

            document.getElementById('mensaje').innerText = 'Enviando código...';

            try {
                const res = await fetch(`/api/auth/solicitar-recuperacion?email=${encodeURIComponent(email)}`, { method: 'POST' });
                const texto = await res.text();
                
                document.getElementById('mensaje').innerText = texto;
                if (res.ok) {
                    document.getElementById('paso1').style.display = 'none';
                    document.getElementById('paso2').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('mensaje').innerText = 'Error al conectar con el servidor.';
            }
        }

        async function restablecer() {
            const email = document.getElementById('email').value;
            const codigo = document.getElementById('codigo').value;
            const nuevaPassword = document.getElementById('nuevaPassword').value;

            if (!codigo || !nuevaPassword) {
                document.getElementById('mensaje').innerText = 'Por favor completa todos los campos.';
                return;
            }

            try {
                const res = await fetch(`/api/auth/restablecer-password?email=${encodeURIComponent(email)}&codigo=${encodeURIComponent(codigo)}&nuevaPassword=${encodeURIComponent(nuevaPassword)}`, { method: 'POST' });
                const texto = await res.text();

                document.getElementById('mensaje').innerText = texto;
                if (res.ok) {
                    setTimeout(() => window.location.href = 'login.html', 2000);
                }
            } catch (err) {
                document.getElementById('mensaje').innerText = 'Error al procesar la solicitud.';
            }
        }
    </script>
</body>
</html>
