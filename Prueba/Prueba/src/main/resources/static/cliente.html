<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Restaurante - Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- PASO 1: BARRA SUPERIOR Y NAVEGACIÓN -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand fw-bold" href="#">🍽️ Menú para Clientes</a>
            <div>
                <button class="btn btn-warning me-2" data-bs-toggle="modal" data-bs-target="#modalCarrito">
                    🛒 Carrito (<span id="cant-carrito">0</span>)
                </button>
                <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#modalPerfil" onclick="cargarDatosPerfil()">
                    👤 Mi Perfil
                </button>
                <button class="btn btn-outline-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- SECCIÓN DE SEGUIMIENTO DE PEDIDOS -->
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0">📦 Mis Pedidos</h5>
                <button class="btn btn-sm btn-outline-light" onclick="cargarMisPedidos()">🔄 Actualizar Estado</button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th># Pedido</th>
                                <th>Detalle</th>
                                <th>Total</th>
                                <th>Estado actual</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-mis-pedidos">
                            <!-- Se carga dinámicamente -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- PASO 3: FILTRADO Y BÚSQUEDA DE PLATOS -->
        <div class="card shadow-sm mb-4 border-0 p-3">
            <div class="row g-3">
                <div class="col-md-8">
                    <input type="text" id="input-buscar" class="form-control" placeholder="🔍 Buscar plato por nombre..." onkeyup="filtrarPlatos()">
                </div>
                <div class="col-md-4">
                    <select id="select-categoria" class="form-select" onchange="filtrarPlatos()">
                        <option value="">Todas las categorías</option>
                        <option value="Entradas">Entradas</option>
                        <option value="Platos Fuertes">Platos Fuertes</option>
                        <option value="Bebidas">Bebidas</option>
                        <option value="Postres">Postres</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- CATÁLOGO DE PLATOS -->
        <h3 class="mb-4 text-secondary">📋 Selecciona tus Platos</h3>
        <div id="contenedor-platos" class="row">
            <!-- Platos dinámicos -->
        </div>
    </div>

    <!-- MODAL DEL CARRITO DE COMPRAS -->
    <div class="modal fade" id="modalCarrito" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">🛒 Tu Pedido</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-3">
                    <ul id="lista-carrito" class="list-group mb-3">
                        <!-- Ítems del carrito -->
                    </ul>
                    <div class="d-flex justify-content-between fw-bold fs-5 mb-3">
                        <span>Total:</span>
                        <span id="total-carrito">$0</span>
                    </div>
                    <button class="btn btn-success w-100 fw-bold" onclick="realizarPedido()">Confirmar Pedido</button>
                </div>
            </div>
        </div>
    </div>

    <!-- PASO 2: MODAL MI PERFIL -->
    <div class="modal fade" id="modalPerfil" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title">👤 Mi Perfil</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="form-perfil">
                        <div class="mb-3">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" id="perfil-email" class="form-control" readonly disabled>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Nombre Completo</label>
                            <input type="text" id="perfil-nombre" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" id="perfil-telefono" class="form-control" placeholder="Ej: 3001234567">
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">Dirección de Entrega</label>
                            <input type="text" id="perfil-direccion" class="form-control" placeholder="Ej: Calle 10 #45-20">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold">Guardar Cambios</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const API_PLATOS = "http://localhost:8080/api/platos";
        const API_PEDIDOS = "http://localhost:8080/api/pedidos";
        const API_USUARIOS = "http://localhost:8080/api/usuarios";
        
        let listaPlatosGeneral = []; // Copia global de platos para filtrado
        let carrito = [];

        document.addEventListener("DOMContentLoaded", () => {
            cargarPlatos();
            cargarMisPedidos();
        });

        function cerrarSesion() {
            localStorage.clear();
            window.location.href = "login.html";
        }

        async function cargarPlatos() {
            try {
                const res = await fetch(API_PLATOS);
                listaPlatosGeneral = await res.json();
                renderizarPlatos(listaPlatosGeneral);
            } catch (err) {
                console.error("Error al cargar platos:", err);
            }
        }

        function renderizarPlatos(platos) {
            const contenedor = document.getElementById("contenedor-platos");
            contenedor.innerHTML = "";

            if (platos.length === 0) {
                contenedor.innerHTML = `<div class="col-12"><p class="text-muted text-center py-4">No se encontraron platos con los criterios seleccionados.</p></div>`;
                return;
            }

            platos.forEach(plato => {
                const nombreEscapado = plato.nombre.replace(/'/g, "\\'").replace(/"/g, '&quot;');
                
                contenedor.innerHTML += `
                    <div class="col-md-4 mb-4">
                        <div class="card h-100 shadow-sm">
                            <img src="${plato.imagen}" class="card-img-top" alt="${plato.nombre}" style="height: 200px; object-fit: cover;" onerror="this.src='https://via.placeholder.com/300x200?text=Sin+Imagen'">
                            <div class="card-body d-flex flex-column justify-content-between">
                                <div>
                                    <h5 class="card-title">${plato.nombre}</h5>
                                    <p class="card-text text-muted small">${plato.descripcion || 'Sin descripción.'}</p>
                                </div>
                                <div>
                                    <p class="card-text text-success fw-bold fs-5 mb-2">$${plato.precio}</p>
                                    <button class="btn btn-outline-primary w-100" onclick="agregarAlCarrito('${nombreEscapado}', ${plato.precio})">
                                        ➕ Agregar al Carrito
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // LÓGICA PASO 3: FILTRAR PLATOS POR NOMBRE Y CATEGORÍA
        function filtrarPlatos() {
            const busqueda = document.getElementById("input-buscar").value.toLowerCase();
            const categoria = document.getElementById("select-categoria").value;

            const platosFiltrados = listaPlatosGeneral.filter(plato => {
                const coincideNombre = plato.nombre.toLowerCase().includes(busqueda);
                const coincideCategoria = categoria === "" || (plato.categoria && plato.categoria === categoria);
                return coincideNombre && coincideCategoria;
            });

            renderizarPlatos(platosFiltrados);
        }

        async function cargarMisPedidos() {
            const correoCliente = localStorage.getItem("email") || "juan.echeverry-ca@uniminuto.edu.co";
            
            try {
                const res = await fetch(API_PEDIDOS);
                if (!res.ok) throw new Error("Error en la petición de pedidos");
                
                const pedidos = await res.json();
                const tabla = document.getElementById("tabla-mis-pedidos");
                tabla.innerHTML = "";

                const misPedidos = pedidos.filter(p => p.clienteEmail === correoCliente);

                if (misPedidos.length === 0) {
                    tabla.innerHTML = `<tr><td colspan="4" class="text-center text-muted p-3">No has realizado ningún pedido aún.</td></tr>`;
                    return;
                }

                misPedidos.forEach(p => {
                    const estado = (p.estado || "PENDIENTE").toUpperCase();
                    let badgeClass = "bg-warning text-dark";
                    let textoFormateado = "PENDIENTE";

                    if (estado === "EN_PREPARACION") {
                        badgeClass = "bg-info text-dark";
                        textoFormateado = "👨‍🍳 EN PREPARACIÓN";
                    } else if (estado === "ENTREGADO") {
                        badgeClass = "bg-success";
                        textoFormateado = "✅ ENTREGADO";
                    } else if (estado === "CANCELADO") {
                        badgeClass = "bg-danger";
                        textoFormateado = "❌ CANCELADO";
                    } else {
                        badgeClass = "bg-warning text-dark";
                        textoFormateado = "⏳ PENDIENTE";
                    }

                    tabla.innerHTML += `
                        <tr>
                            <td><strong>#${p.id}</strong></td>
                            <td>${p.detallePlatos}</td>
                            <td class="text-success fw-bold">$${p.total}</td>
                            <td><span class="badge ${badgeClass}">${textoFormateado}</span></td>
                        </tr>
                    `;
                });
            } catch (err) {
                console.error("Error al cargar mis pedidos:", err);
            }
        }

        function agregarAlCarrito(nombre, precio) {
            carrito.push({ nombre, precio });
            actualizarCarritoUI();
        }

        function actualizarCarritoUI() {
            document.getElementById("cant-carrito").innerText = carrito.length;
            const lista = document.getElementById("lista-carrito");
            lista.innerHTML = "";

            if (carrito.length === 0) {
                lista.innerHTML = `<li class="list-group-item text-center text-muted">El carrito está vacío</li>`;
                document.getElementById("total-carrito").innerText = "$0";
                return;
            }

            let total = 0;
            carrito.forEach((item, index) => {
                total += item.precio;
                lista.innerHTML += `
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                        <div>
                            <span>${item.nombre}</span>
                            <span class="fw-bold ms-2 text-success">$${item.precio}</span>
                        </div>
                        <button class="btn btn-sm btn-danger" onclick="eliminarDelCarrito(${index})">✕</button>
                    </li>
                `;
            });

            document.getElementById("total-carrito").innerText = `$${total}`;
        }

        function eliminarDelCarrito(index) {
            carrito.splice(index, 1);
            actualizarCarritoUI();
        }

        async function realizarPedido() {
            if (carrito.length === 0) {
                alert("El carrito está vacío.");
                return;
            }

            const detalle = carrito.map(p => p.nombre).join(", ");
            const totalSuma = carrito.reduce((acc, p) => acc + p.precio, 0);
            const correoCliente = localStorage.getItem("email") || "juan.echeverry-ca@uniminuto.edu.co";

            const datosPedido = {
                clienteEmail: correoCliente,
                detallePlatos: detalle,
                total: totalSuma,
                estado: "PENDIENTE"
            };

            try {
                const res = await fetch(API_PEDIDOS, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datosPedido)
                });

                if (res.ok) {
                    alert("¡Pedido realizado con éxito! Tu comida está en preparación.");
                    carrito = [];
                    actualizarCarritoUI();
                    
                    const modalElement = document.getElementById('modalCarrito');
                    const modalInstance = bootstrap.Modal.getInstance(modalElement);
                    if (modalInstance) {
                        modalInstance.hide();
                    }

                    cargarMisPedidos();
                } else {
                    alert("Error al registrar el pedido en el servidor.");
                }
            } catch (err) {
                console.error("Error al conectar:", err);
                alert("No se pudo conectar con el servidor.");
            }
        }

        // LÓGICA PASO 2: PERFIL DE USUARIO
        async function cargarDatosPerfil() {
            const email = localStorage.getItem("email") || "juan.echeverry-ca@uniminuto.edu.co";
            document.getElementById("perfil-email").value = email;

            try {
                const res = await fetch(`${API_USUARIOS}/perfil?email=${encodeURIComponent(email)}`);
                if (res.ok) {
                    const usuario = await res.json();
                    document.getElementById("perfil-nombre").value = usuario.nombre || "";
                    document.getElementById("perfil-telefono").value = usuario.telefono || "";
                    document.getElementById("perfil-direccion").value = usuario.direccion || "";
                }
            } catch (err) {
                console.error("Error al cargar perfil:", err);
            }
        }

        document.getElementById("form-perfil")?.addEventListener("submit", async (e) => {
            e.preventDefault();
            const datos = {
                email: document.getElementById("perfil-email").value,
                nombre: document.getElementById("perfil-nombre").value,
                telefono: document.getElementById("perfil-telefono").value,
                direccion: document.getElementById("perfil-direccion").value
            };

            try {
                const res = await fetch(`${API_USUARIOS}/perfil`, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(datos)
                });

                if (res.ok) {
                    alert("¡Perfil actualizado con éxito!");
                    const modalElement = document.getElementById('modalPerfil');
                    const modalInstance = bootstrap.Modal.getInstance(modalElement);
                    if (modalInstance) modalInstance.hide();
                } else {
                    alert("Error al actualizar el perfil.");
                }
            } catch (err) {
                console.error("Error al actualizar perfil:", err);
            }
        });
    </script>
</body>
</html>
